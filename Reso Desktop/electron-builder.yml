appId: fun.sekretariat.reso
productName: ReSo
publish:
  provider: github
  owner: minilabs-id
  repo: ReSo
  releaseType: release
directories:
  output: release
  buildResources: assets
files:
  - out/**/*
  - package.json
  - assets/**/*
asar: true
# Native sudah di-rebuild lebih dulu oleh `npm run rebuild:native` memakai
# prebuild Electron ABI 130 (tanpa Visual Studio), jadi electron-builder tidak
# perlu meng-compile ulang.
npmRebuild: false
asarUnpack:
  - node_modules/better-sqlite3/build/Release/**/*
# Ikon .exe ditanamkan lewat afterPack (rcedit langsung) karena winCodeSign
# butuh privilegi symlink yang tidak selalu tersedia di mesin dev.
afterPack: scripts/after-pack.cjs
win:
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ReSoSetup-${version}.${ext}
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
