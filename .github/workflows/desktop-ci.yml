name: Desktop CI

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: Reso Desktop

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 'Reso Desktop/package-lock.json'

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck:desktop
      - run: npm test
      - run: npm run build
      - run: npm run verify:bundle
